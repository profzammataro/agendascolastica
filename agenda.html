<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Liceo Labriola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --paper:#F4EFE0;
    --paper-2:#ECE4CC;
    --ink:#22322A;
    --ink-soft:#5B6B60;
    --accent:#B4842A;
    --accent-soft:#E4C98A;
    --line:#CBBF9E;
    --card:#FBF8EF;
    --radius:14px;
    --font-display:'Lora',serif;
    --font-body:'Inter',system-ui,sans-serif;

    --tipo-assemblea-istituto:#4285F4;      --tipo-assemblea-istituto-bg:#D2E2FC;
    --tipo-assemblea-sindacale:#D93025;     --tipo-assemblea-sindacale-bg:#F6CDCB;
    --tipo-attivita-fsl:#1E8E3E;            --tipo-attivita-fsl-bg:#C9E4D1;
    --tipo-attivita-sportiva:#FB8C00;       --tipo-attivita-sportiva-bg:#FEE3C2;
    --tipo-colloqui-docenti:#7B1FA2;        --tipo-colloqui-docenti-bg:#DFC9E9;
    --tipo-conferenza:#00ACC1;              --tipo-conferenza-bg:#C2EBF0;
    --tipo-formazione:#3949AB;              --tipo-formazione-bg:#CFD3EB;
    --tipo-glo:#5D4037;                     --tipo-glo-bg:#D8D1CF;
    --tipo-mobilita-studentesca:#E91E63;    --tipo-mobilita-studentesca-bg:#FAC9DA;
    --tipo-mostra:#AFB42B;                  --tipo-mostra-bg:#ECEDCC;
    --tipo-premiazione:#F9AB00;             --tipo-premiazione-bg:#FEEBC2;
    --tipo-progetto:#00897B;                --tipo-progetto-bg:#C2E3DF;
    --tipo-riunione:#546E7A;                --tipo-riunione-bg:#D6DCDF;
    --tipo-spettacolo-teatrale:#AA00FF;     --tipo-spettacolo-teatrale-bg:#EBC2FF;
    --tipo-sportello:#7CB342;               --tipo-sportello-bg:#E0EDD2;
    --tipo-uscita:#039BE5;                  --tipo-uscita-bg:#C3E7F9;
    --tipo-viaggio-istruzione:#880E4F;      --tipo-viaggio-istruzione-bg:#E2C5D5;
    --tipo-visita-guidata:#FF7043;          --tipo-visita-guidata-bg:#FFDDD2;
    --tipo-visiting:#0D47A1;                --tipo-visiting-bg:#C5D3E8;
    --tipo-altro:#757575;                   --tipo-altro-bg:#DEDEDE;

    --luogo-bg:#E4C98A;
    --luogo-ink:#3B2A0A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(rgba(255,255,255,0.30), rgba(255,255,255,0.30)),
      url('bg.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper-2);
  }
  .header-inner{
    max-width:560px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
    text-align:left;
  }
  header .logo{
    display:block;
    height:64px;
    width:auto;
    flex-shrink:0;
    border-radius:8px;
  }
  .header-text{min-width:0;}
  header h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.3rem;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.82rem;
  }
  .toggle{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:18px auto 0;
    max-width:280px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }
  .toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 14px;
    border-radius:999px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.88rem;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.2s, color 0.2s;
  }
  .toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }

  main{max-width:560px;margin:0 auto;padding:20px 16px;}

  .search-bar{margin-bottom:18px;}
  .search-bar input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    font-family:var(--font-body);
    font-size:0.92rem;
    background:var(--card);
    color:var(--ink);
  }
  .search-bar input::placeholder{color:var(--ink-soft);}
  .search-result-date{
    font-size:0.78rem;
    font-weight:700;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:0 0 4px 2px;
  }

  /* ---- DAY (ghiera) VIEW ---- */
  .day-nav-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 10px 10px;
    margin-bottom:22px;
  }
  .day-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .day-nav button{
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    font-size:1.2rem;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.15s;
  }
  .day-nav button:hover{background:var(--accent-soft);}
  .day-display{
    text-align:center;
    flex:1;
    cursor:pointer;
  }
  .day-display .weekday{
    display:block;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--accent);
    font-weight:600;
  }
  .day-display .num{
    display:block;
    font-family:var(--font-display);
    font-size:2.6rem;
    line-height:1.1;
    font-weight:700;
  }
  .day-display .month{
    display:block;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .today-pill{
    display:block;
    text-align:center;
    margin:2px auto 0;
    padding-bottom:6px;
    font-size:0.78rem;
    color:var(--accent);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:var(--font-body);
  }

  .impegno-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:5px solid var(--tipo-altro);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .impegno-card.assemblea-istituto{border-left-color:var(--tipo-assemblea-istituto);background:var(--tipo-assemblea-istituto-bg);}
  .impegno-card.assemblea-sindacale{border-left-color:var(--tipo-assemblea-sindacale);background:var(--tipo-assemblea-sindacale-bg);}
  .impegno-card.attivita-fsl{border-left-color:var(--tipo-attivita-fsl);background:var(--tipo-attivita-fsl-bg);}
  .impegno-card.attivita-sportiva{border-left-color:var(--tipo-attivita-sportiva);background:var(--tipo-attivita-sportiva-bg);}
  .impegno-card.colloqui-docenti{border-left-color:var(--tipo-colloqui-docenti);background:var(--tipo-colloqui-docenti-bg);}
  .impegno-card.conferenza{border-left-color:var(--tipo-conferenza);background:var(--tipo-conferenza-bg);}
  .impegno-card.formazione{border-left-color:var(--tipo-formazione);background:var(--tipo-formazione-bg);}
  .impegno-card.glo{border-left-color:var(--tipo-glo);background:var(--tipo-glo-bg);}
  .impegno-card.mobilita-studentesca{border-left-color:var(--tipo-mobilita-studentesca);background:var(--tipo-mobilita-studentesca-bg);}
  .impegno-card.mostra{border-left-color:var(--tipo-mostra);background:var(--tipo-mostra-bg);}
  .impegno-card.premiazione{border-left-color:var(--tipo-premiazione);background:var(--tipo-premiazione-bg);}
  .impegno-card.progetto{border-left-color:var(--tipo-progetto);background:var(--tipo-progetto-bg);}
  .impegno-card.riunione{border-left-color:var(--tipo-riunione);background:var(--tipo-riunione-bg);}
  .impegno-card.spettacolo-teatrale{border-left-color:var(--tipo-spettacolo-teatrale);background:var(--tipo-spettacolo-teatrale-bg);}
  .impegno-card.sportello{border-left-color:var(--tipo-sportello);background:var(--tipo-sportello-bg);}
  .impegno-card.uscita{border-left-color:var(--tipo-uscita);background:var(--tipo-uscita-bg);}
  .impegno-card.viaggio-istruzione{border-left-color:var(--tipo-viaggio-istruzione);background:var(--tipo-viaggio-istruzione-bg);}
  .impegno-card.visita-guidata{border-left-color:var(--tipo-visita-guidata);background:var(--tipo-visita-guidata-bg);}
  .impegno-card.visiting{border-left-color:var(--tipo-visiting);background:var(--tipo-visiting-bg);}
  .impegno-card.altro{border-left-color:var(--tipo-altro);background:var(--tipo-altro-bg);}
  .impegno-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:6px;
  }
  .impegno-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.05rem;
  }
  .impegno-ora{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
    font-size:0.88rem;
    font-variant-numeric:tabular-nums;
    padding:4px 11px;
    border-radius:8px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .impegno-ora .sep{color:var(--accent-soft);font-weight:600;}
  .referente{
    display:inline-flex;
    align-items:center;
    gap:4px;
    color:var(--ink);
    font-weight:600;
  }
  .impegno-meta{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .luogo-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    background:var(--luogo-bg);
    color:var(--luogo-ink);
    font-weight:700;
    font-size:0.76rem;
    padding:3px 10px;
    border-radius:999px;
  }
  .impegno-desc{
    font-size:0.9rem;
    color:var(--ink);
    line-height:1.4;
  }
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:40px 20px;
    font-style:italic;
  }

  /* ---- MONTH VIEW ---- */
  .month-nav-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 10px;
    margin-bottom:16px;
  }
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
  }
  .month-nav button{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);font-size:1.1rem;cursor:pointer;
  }
  .month-nav h2{
    font-family:var(--font-display);font-size:1.2rem;margin:0;font-weight:600;
    text-transform:capitalize;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cal-weekday{
    text-align:center;font-size:0.7rem;color:var(--ink-soft);
    text-transform:uppercase;padding-bottom:6px;font-weight:600;
  }
  .cal-cell{
    aspect-ratio:1;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    position:relative;
    font-size:0.85rem;
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today{border-color:var(--accent);border-width:2px;}
  .cal-cell .dots{
    display:flex;gap:2px;margin-top:3px;
  }
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;}
  .dot.assemblea-istituto{background:var(--tipo-assemblea-istituto);}
  .dot.assemblea-sindacale{background:var(--tipo-assemblea-sindacale);}
  .dot.attivita-fsl{background:var(--tipo-attivita-fsl);}
  .dot.attivita-sportiva{background:var(--tipo-attivita-sportiva);}
  .dot.colloqui-docenti{background:var(--tipo-colloqui-docenti);}
  .dot.conferenza{background:var(--tipo-conferenza);}
  .dot.formazione{background:var(--tipo-formazione);}
  .dot.glo{background:var(--tipo-glo);}
  .dot.mobilita-studentesca{background:var(--tipo-mobilita-studentesca);}
  .dot.mostra{background:var(--tipo-mostra);}
  .dot.premiazione{background:var(--tipo-premiazione);}
  .dot.progetto{background:var(--tipo-progetto);}
  .dot.riunione{background:var(--tipo-riunione);}
  .dot.spettacolo-teatrale{background:var(--tipo-spettacolo-teatrale);}
  .dot.sportello{background:var(--tipo-sportello);}
  .dot.uscita{background:var(--tipo-uscita);}
  .dot.viaggio-istruzione{background:var(--tipo-viaggio-istruzione);}
  .dot.visita-guidata{background:var(--tipo-visita-guidata);}
  .dot.visiting{background:var(--tipo-visiting);}
  .dot.altro{background:var(--tipo-altro);}

  footer{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:30px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="logo.jpg" alt="Logo Liceo Labriola" class="logo">
    <div class="header-text">
      <h1>Agenda del Liceo</h1>
     
    </div>
  </div>
</header>

<div class="toggle">
  <button id="btn-day" class="active">Giorno</button>
  <button id="btn-month">Mese</button>
</div>

<main>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Cerca per titolo, referente, luogo...">
  </div>

  <div id="view-search" style="display:none;">
    <div id="search-list"></div>
  </div>

  <div id="view-day">
    <div class="day-nav-wrap">
      <div class="day-nav">
        <button id="prev-day" aria-label="Giorno precedente">&#8592;</button>
        <div class="day-display" id="day-display">
          <span class="weekday" id="dd-weekday">&nbsp;</span>
          <span class="num" id="dd-num">&nbsp;</span>
          <span class="month" id="dd-month">&nbsp;</span>
        </div>
        <button id="next-day" aria-label="Giorno successivo">&#8594;</button>
      </div>
      <button class="today-pill" id="go-today">Torna a oggi</button>
    </div>
    <div id="day-list"></div>
  </div>

  <div id="view-month" style="display:none;">
    <div class="month-nav-wrap">
      <div class="month-nav">
        <button id="prev-month" aria-label="Mese precedente">&#8592;</button>
        <h2 id="month-title">&nbsp;</h2>
        <button id="next-month" aria-label="Mese successivo">&#8594;</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <footer>Liceo Labriola &middot; aggiornato in tempo reale</footer>
</main>

<script>
// ====== CONFIGURA QUI IL TUO PROGETTO FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyAiNAHGXzxPj6_TRQNLybjMrBbsANi4kgY",
  authDomain: "agenda-8cca3.firebaseapp.com",
  databaseURL: "https://agenda-8cca3-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "agenda-8cca3",
  storageBucket: "agenda-8cca3.firebasestorage.app",
  messagingSenderId: "40726936407",
  appId: "1:40726936407:web:7d91878c2982334381dc12"
};
const DB_ROOT = "agendaLabriola"; // nodo radice condiviso con admin.html

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ====== STATO ======
let impegni = {}; // { pushId: {data, ora, oraFine, tipo, classe, referente, titolo, descrizione} }
let currentDate = new Date();
let currentMonth = new Date();
let mode = 'day'; // 'day' | 'month'

const WEEKDAYS = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const TIPO_LABEL = {
  'assemblea-istituto':'Assemblea d\'istituto',
  'assemblea-sindacale':'Assemblea sindacale',
  'attivita-fsl':'Attività FSL',
  'attivita-sportiva':'Attività sportiva',
  'colloqui-docenti':'Colloqui Docenti',
  'conferenza':'Conferenza',
  'formazione':'Formazione Docenti',
  'glo':'GLO',
  'mobilita-studentesca':'Mobilità Studentesca',
  'mostra':'Mostra',
  'premiazione':'Premiazione',
  'progetto':'Progetto',
  'riunione':'Riunione',
  'spettacolo-teatrale':'Spettacolo teatrale',
  'sportello':'Sportello didattico',
  'uscita':'Uscita didattica',
  'viaggio-istruzione':'Viaggio d\'istruzione',
  'visita-guidata':'Visita guidata',
  'visiting':'Visiting',
  'altro':'Altro'
};

function fmtISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ====== FIREBASE LISTENER (sola lettura) ======
db.ref(DB_ROOT + '/impegni').on('value', snap => {
  impegni = snap.val() || {};
  renderDay();
  renderMonth();
});

// ====== VISTA GIORNO ======
function renderDay(){
  document.getElementById('dd-weekday').textContent = WEEKDAYS[currentDate.getDay()];
  document.getElementById('dd-num').textContent = currentDate.getDate();
  document.getElementById('dd-month').textContent = MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();

  const iso = fmtISO(currentDate);
  const list = Object.values(impegni)
    .filter(i => i.data === iso)
    .sort((a,b) => (a.ora||'').localeCompare(b.ora||''));

  const container = document.getElementById('day-list');
  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">Nessun impegno per questo giorno.</div>';
    return;
  }
  container.innerHTML = list.map(i => {
    const orario = i.ora
      ? `<span class="impegno-ora">${escapeHtml(i.ora)}${i.oraFine ? `<span class="sep">&ndash;</span>${escapeHtml(i.oraFine)}` : ''}</span>`
      : '';
    return `
    <div class="impegno-card ${i.tipo || 'altro'}">
      <div class="impegno-row">
        <span class="impegno-title">${escapeHtml(i.titolo || '')}</span>
        ${orario}
      </div>
      <div class="impegno-meta">
        <span>${TIPO_LABEL[i.tipo] || 'Altro'}</span>
        ${i.classe ? `<span class="luogo-badge">&#128205; ${escapeHtml(i.classe)}</span>` : ''}
        ${i.referente ? `<span class="referente">&#128100; Referente: ${escapeHtml(i.referente)}</span>` : ''}
      </div>
      ${i.descrizione ? `<div class="impegno-desc">${escapeHtml(i.descrizione)}</div>` : ''}
    </div>
  `;}).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('prev-day').onclick = () => { currentDate.setDate(currentDate.getDate()-1); renderDay(); };
document.getElementById('next-day').onclick = () => { currentDate.setDate(currentDate.getDate()+1); renderDay(); };
document.getElementById('go-today').onclick = () => { currentDate = new Date(); renderDay(); };
document.getElementById('day-display').onclick = () => { currentMonth = new Date(currentDate); switchMode('month'); };

// ====== VISTA MESE ======
function renderMonthWeekdayHeader(){
  const el = document.getElementById('cal-weekdays');
  const short = ['L','M','M','G','V','S','D'];
  el.innerHTML = short.map(w => `<div class="cal-weekday">${w}</div>`).join('');
}

function renderMonth(){
  document.getElementById('month-title').textContent = MONTHS[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  // lunedì = 0 ... domenica = 6
  let startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = fmtISO(new Date());

  // conta impegni per giorno, per tipo
  const byDay = {};
  Object.values(impegni).forEach(i => {
    if(!i.data) return;
    const d = new Date(i.data + 'T00:00:00');
    if(d.getFullYear() === year && d.getMonth() === month){
      const day = d.getDate();
      byDay[day] = byDay[day] || new Set();
      byDay[day].add(i.tipo || 'altro');
    }
  });

  let cells = '';
  for(let i=0; i<startOffset; i++) cells += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const isToday = iso === todayIso;
    const dots = byDay[day] ? Array.from(byDay[day]).slice(0,4).map(t => `<span class="dot ${t}"></span>`).join('') : '';
    cells += `<div class="cal-cell ${isToday?'today':''}" data-day="${day}">
      <span>${day}</span>
      <span class="dots">${dots}</span>
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cells;

  document.querySelectorAll('.cal-cell[data-day]').forEach(cell => {
    cell.onclick = () => {
      currentDate = new Date(year, month, parseInt(cell.dataset.day));
      switchMode('day');
    };
  });
}

document.getElementById('prev-month').onclick = () => { currentMonth.setMonth(currentMonth.getMonth()-1); renderMonth(); };
document.getElementById('next-month').onclick = () => { currentMonth.setMonth(currentMonth.getMonth()+1); renderMonth(); };

// ====== TOGGLE ======
function switchMode(m){
  mode = m;
  document.getElementById('view-day').style.display = m==='day' ? 'block':'none';
  document.getElementById('view-month').style.display = m==='month' ? 'block':'none';
  document.getElementById('btn-day').classList.toggle('active', m==='day');
  document.getElementById('btn-month').classList.toggle('active', m==='month');
  if(m==='day') renderDay(); else renderMonth();
}
document.getElementById('btn-day').onclick = () => switchMode('day');
document.getElementById('btn-month').onclick = () => switchMode('month');

// ====== RICERCA ======
function impegnoCardHTML(i, showDate){
  const orario = i.ora
    ? `<span class="impegno-ora">${escapeHtml(i.ora)}${i.oraFine ? `<span class="sep">&ndash;</span>${escapeHtml(i.oraFine)}` : ''}</span>`
    : '';
  const dateLabel = showDate ? `<div class="search-result-date">${escapeHtml(formatDateLong(i.data))}</div>` : '';
  return `
    ${dateLabel}
    <div class="impegno-card ${i.tipo || 'altro'}">
      <div class="impegno-row">
        <span class="impegno-title">${escapeHtml(i.titolo || '')}</span>
        ${orario}
      </div>
      <div class="impegno-meta">
        <span>${TIPO_LABEL[i.tipo] || 'Altro'}</span>
        ${i.classe ? `<span class="luogo-badge">&#128205; ${escapeHtml(i.classe)}</span>` : ''}
        ${i.referente ? `<span class="referente">&#128100; Referente: ${escapeHtml(i.referente)}</span>` : ''}
      </div>
      ${i.descrizione ? `<div class="impegno-desc">${escapeHtml(i.descrizione)}</div>` : ''}
    </div>
  `;
}

function formatDateLong(iso){
  const d = new Date(iso + 'T00:00:00');
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function renderSearch(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const container = document.getElementById('search-list');
  if(!q){ container.innerHTML = ''; return; }

  const results = Object.values(impegni)
    .filter(i => {
      const haystack = [i.titolo, i.referente, i.classe, i.descrizione, TIPO_LABEL[i.tipo]]
        .filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(q);
    })
    .sort((a,b) => (a.data + (a.ora||'')).localeCompare(b.data + (b.ora||'')));

  if(results.length === 0){
    container.innerHTML = '<div class="empty-state">Nessun impegno trovato.</div>';
    return;
  }
  container.innerHTML = results.map(i => impegnoCardHTML(i, true)).join('');
}

document.getElementById('search-input').oninput = () => {
  const hasQuery = document.getElementById('search-input').value.trim().length > 0;
  document.getElementById('view-search').style.display = hasQuery ? 'block' : 'none';
  document.getElementById('view-day').style.display = (!hasQuery && mode==='day') ? 'block' : 'none';
  document.getElementById('view-month').style.display = (!hasQuery && mode==='month') ? 'block' : 'none';
  if(hasQuery) renderSearch();
};

renderMonthWeekdayHeader();
renderDay();
renderMonth();
</script>
