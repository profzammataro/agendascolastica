<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Liceo Labriola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --paper:#F4EFE0;
    --paper-2:#ECE4CC;
    --ink:#22322A;
    --ink-soft:#5B6B60;
    --accent:#B4842A;
    --accent-soft:#E4C98A;
    --line:#CBBF9E;
    --card:#FBF8EF;
    --radius:14px;
    --font-display:'Lora',serif;
    --font-body:'Inter',system-ui,sans-serif;

    --tipo-verifica:#A23E3E;
    --tipo-uscita:#2E6B5E;
    --tipo-assemblea:#3D5A80;
    --tipo-convocazione:#8A5A2E;
    --tipo-altro:#6B5B6E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:28px 20px 16px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:var(--paper-2);
  }
  header h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.85rem;
  }
  .toggle{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:18px auto 0;
    max-width:280px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }
  .toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 14px;
    border-radius:999px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.88rem;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.2s, color 0.2s;
  }
  .toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }

  main{max-width:560px;margin:0 auto;padding:20px 16px;}

  /* ---- DAY (ghiera) VIEW ---- */
  .day-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
  }
  .day-nav button{
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    font-size:1.2rem;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.15s;
  }
  .day-nav button:hover{background:var(--accent-soft);}
  .day-display{
    text-align:center;
    flex:1;
    cursor:pointer;
  }
  .day-display .weekday{
    display:block;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--accent);
    font-weight:600;
  }
  .day-display .num{
    display:block;
    font-family:var(--font-display);
    font-size:2.6rem;
    line-height:1.1;
    font-weight:700;
  }
  .day-display .month{
    display:block;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .today-pill{
    display:block;
    text-align:center;
    margin:-12px auto 20px;
    font-size:0.78rem;
    color:var(--accent);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:var(--font-body);
  }

  .impegno-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:5px solid var(--tipo-altro);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .impegno-card.verifica{border-left-color:var(--tipo-verifica);}
  .impegno-card.uscita{border-left-color:var(--tipo-uscita);}
  .impegno-card.assemblea{border-left-color:var(--tipo-assemblea);}
  .impegno-card.convocazione{border-left-color:var(--tipo-convocazione);}
  .impegno-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:4px;
  }
  .impegno-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.05rem;
  }
  .impegno-ora{
    font-size:0.8rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .impegno-meta{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .impegno-desc{
    font-size:0.9rem;
    color:var(--ink);
    line-height:1.4;
  }
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:40px 20px;
    font-style:italic;
  }

  /* ---- MONTH VIEW ---- */
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .month-nav button{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);font-size:1.1rem;cursor:pointer;
  }
  .month-nav h2{
    font-family:var(--font-display);font-size:1.2rem;margin:0;font-weight:600;
    text-transform:capitalize;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cal-weekday{
    text-align:center;font-size:0.7rem;color:var(--ink-soft);
    text-transform:uppercase;padding-bottom:6px;font-weight:600;
  }
  .cal-cell{
    aspect-ratio:1;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    position:relative;
    font-size:0.85rem;
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today{border-color:var(--accent);border-width:2px;}
  .cal-cell .dots{
    display:flex;gap:2px;margin-top:3px;
  }
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;}
  .dot.verifica{background:var(--tipo-verifica);}
  .dot.uscita{background:var(--tipo-uscita);}
  .dot.assemblea{background:var(--tipo-assemblea);}
  .dot.convocazione{background:var(--tipo-convocazione);}
  .dot.altro{background:var(--tipo-altro);}

  footer{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:30px;
  }
</style>
</head>
<body>

<header>
  <h1>Agenda del Liceo</h1>
  <p>Impegni giornalieri &mdash; sola consultazione</p>
</header>

<div class="toggle">
  <button id="btn-day" class="active">Giorno</button>
  <button id="btn-month">Mese</button>
</div>

<main>
  <div id="view-day">
    <div class="day-nav">
      <button id="prev-day" aria-label="Giorno precedente">&#8592;</button>
      <div class="day-display" id="day-display">
        <span class="weekday" id="dd-weekday">&nbsp;</span>
        <span class="num" id="dd-num">&nbsp;</span>
        <span class="month" id="dd-month">&nbsp;</span>
      </div>
      <button id="next-day" aria-label="Giorno successivo">&#8594;</button>
    </div>
    <button class="today-pill" id="go-today">Torna a oggi</button>
    <div id="day-list"></div>
  </div>

  <div id="view-month" style="display:none;">
    <div class="month-nav">
      <button id="prev-month" aria-label="Mese precedente">&#8592;</button>
      <h2 id="month-title">&nbsp;</h2>
      <button id="next-month" aria-label="Mese successivo">&#8594;</button>
    </div>
    <div class="cal-grid" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <footer>Liceo Labriola &middot; aggiornato in tempo reale</footer>
</main>

<script>
// ====== CONFIGURA QUI IL TUO PROGETTO FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyAiNAHGXzxPj6_TRQNLybjMrBbsANi4kgY",
  authDomain: "agenda-8cca3.firebaseapp.com",
  databaseURL: "https://agenda-8cca3-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "agenda-8cca3",
  storageBucket: "agenda-8cca3.firebasestorage.app",
  messagingSenderId: "40726936407",
  appId: "1:40726936407:web:7d91878c2982334381dc12"
};
const DB_ROOT = "agendaLabriola"; // nodo radice condiviso con admin.html

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ====== STATO ======
let impegni = {}; // { pushId: {data, ora, tipo, classe, titolo, descrizione} }
let currentDate = new Date();
let currentMonth = new Date();
let mode = 'day'; // 'day' | 'month'

const WEEKDAYS = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const TIPO_LABEL = {verifica:'Verifica', uscita:'Uscita didattica', assemblea:'Assemblea', convocazione:'Convocazione', altro:'Altro'};

function fmtISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ====== FIREBASE LISTENER (sola lettura) ======
db.ref(DB_ROOT + '/impegni').on('value', snap => {
  impegni = snap.val() || {};
  renderDay();
  renderMonth();
});

// ====== VISTA GIORNO ======
function renderDay(){
  document.getElementById('dd-weekday').textContent = WEEKDAYS[currentDate.getDay()];
  document.getElementById('dd-num').textContent = currentDate.getDate();
  document.getElementById('dd-month').textContent = MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();

  const iso = fmtISO(currentDate);
  const list = Object.values(impegni)
    .filter(i => i.data === iso)
    .sort((a,b) => (a.ora||'').localeCompare(b.ora||''));

  const container = document.getElementById('day-list');
  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">Nessun impegno per questo giorno.</div>';
    return;
  }
  container.innerHTML = list.map(i => `
    <div class="impegno-card ${i.tipo || 'altro'}">
      <div class="impegno-row">
        <span class="impegno-title">${escapeHtml(i.titolo || '')}</span>
        ${i.ora ? `<span class="impegno-ora">${escapeHtml(i.ora)}</span>` : ''}
      </div>
      <div class="impegno-meta">${TIPO_LABEL[i.tipo] || 'Altro'}${i.classe ? ' &middot; ' + escapeHtml(i.classe) : ''}</div>
      ${i.descrizione ? `<div class="impegno-desc">${escapeHtml(i.descrizione)}</div>` : ''}
    </div>
  `).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('prev-day').onclick = () => { currentDate.setDate(currentDate.getDate()-1); renderDay(); };
document.getElementById('next-day').onclick = () => { currentDate.setDate(currentDate.getDate()+1); renderDay(); };
document.getElementById('go-today').onclick = () => { currentDate = new Date(); renderDay(); };
document.getElementById('day-display').onclick = () => { currentMonth = new Date(currentDate); switchMode('month'); };

// ====== VISTA MESE ======
function renderMonthWeekdayHeader(){
  const el = document.getElementById('cal-weekdays');
  const short = ['L','M','M','G','V','S','D'];
  el.innerHTML = short.map(w => `<div class="cal-weekday">${w}</div>`).join('');
}

function renderMonth(){
  document.getElementById('month-title').textContent = MONTHS[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  // lunedì = 0 ... domenica = 6
  let startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = fmtISO(new Date());

  // conta impegni per giorno, per tipo
  const byDay = {};
  Object.values(impegni).forEach(i => {
    if(!i.data) return;
    const d = new Date(i.data + 'T00:00:00');
    if(d.getFullYear() === year && d.getMonth() === month){
      const day = d.getDate();
      byDay[day] = byDay[day] || new Set();
      byDay[day].add(i.tipo || 'altro');
    }
  });

  let cells = '';
  for(let i=0; i<startOffset; i++) cells += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const isToday = iso === todayIso;
    const dots = byDay[day] ? Array.from(byDay[day]).slice(0,4).map(t => `<span class="dot ${t}"></span>`).join('') : '';
    cells += `<div class="cal-cell ${isToday?'today':''}" data-day="${day}">
      <span>${day}</span>
      <span class="dots">${dots}</span>
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cells;

  document.querySelectorAll('.cal-cell[data-day]').forEach(cell => {
    cell.onclick = () => {
      currentDate = new Date(year, month, parseInt(cell.dataset.day));
      switchMode('day');
    };
  });
}

document.getElementById('prev-month').onclick = () => { currentMonth.setMonth(currentMonth.getMonth()-1); renderMonth(); };
document.getElementById('next-month').onclick = () => { currentMonth.setMonth(currentMonth.getMonth()+1); renderMonth(); };

// ====== TOGGLE ======
function switchMode(m){
  mode = m;
  document.getElementById('view-day').style.display = m==='day' ? 'block':'none';
  document.getElementById('view-month').style.display = m==='month' ? 'block':'none';
  document.getElementById('btn-day').classList.toggle('active', m==='day');
  document.getElementById('btn-month').classList.toggle('active', m==='month');
  if(m==='day') renderDay(); else renderMonth();
}
document.getElementById('btn-day').onclick = () => switchMode('day');
document.getElementById('btn-month').onclick = () => switchMode('month');

renderMonthWeekdayHeader();
renderDay();
renderMonth();
</script>
</body>
</html>
